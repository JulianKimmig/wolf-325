"""

[agents_md.repo-rules.general.rules]
text="""
Repo rules are retrieved on demand. Before code edits, config or hook changes, generated-file updates, long-running commands, external tool use, or subagent delegation, query local rules with repo-rule-search skill:
Use Boolean tags with `AND`, `OR`, `NOT`, and parentheses.
If possible spawn a subagent to retrieve the relevant rules for you (unless you are this agent).
Read the full rule file for any returned rule that applies or remains uncertain.
"""

