name: Publish client

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Qualify and publish wolf-325
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/wolf-325
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.7.21"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --all-extras --dev
      - name: Match tag to package version
        run: test "${GITHUB_REF_NAME}" = "v$(uv version --short)"
      - name: Test client
        run: uv run pytest
      - name: Test Home Assistant integration
        run: uv run pytest -c tests/components/wolf_cwl2/pytest.toml tests/components/wolf_cwl2
      - name: Test Home Assistant floor PyModbus compatibility
        run: uv run --isolated --all-extras --with pymodbus==3.11.2 pytest tests/test_transport.py tests/test_transport_polling.py tests/test_controller.py tests/test_runtime_edges.py tests/test_setting_relations.py
      - name: Test current Home Assistant PyModbus compatibility
        run: uv run --isolated --all-extras --with pymodbus==3.13.1 pytest tests/test_transport.py tests/test_transport_polling.py tests/test_controller.py tests/test_runtime_edges.py tests/test_setting_relations.py
      - name: Build distributions
        run: uv build
      - name: Publish with PyPI Trusted Publishing
        run: uv publish --trusted-publishing always
