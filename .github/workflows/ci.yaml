name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Client and Home Assistant
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.7.21"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-extras --dev

      - name: Test client
        run: uv run pytest

      - name: Test Home Assistant integration
        run: uv run pytest -c tests/components/wolf_cwl2/pytest.toml tests/components/wolf_cwl2

      - name: Build distributions
        run: uv build
